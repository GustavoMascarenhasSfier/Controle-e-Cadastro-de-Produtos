<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Minha loja 1.0</h1>
    </header>

    <main>
        <section class="principal">
            <div class="titulo">
                <h2>Produtos</h2>
                <span>Listas de produtos da minha loja</span>
            </div>

            <div class="card">
                <div class="line-input">
                    <label >Produto</label>
                    <input type="text" id="produto"placeholder="Digite o produto">

                </div>

                <div class="line-input">
                    <label >Preço</label>
                    <input type="number" id="valor" placeholder="valor do produto">

                </div>

                
                 <button onclick="produto.salvar()" id="btn1">Salvar</button>
                    <button onclick="produto.cancelar()">Cancelar</button>

            </div>
        </section>

        <section class="secundaria">
            <div class="conteudos">
                <table border="1">
                    <thead>
                        <th>Id</th>
                        <th>Produto</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </thead>

                    <tbody id="tbody">
                        
                    </tbody>
                </table>
            </div>
        </section>
   

    </main>
    <script src="script.js"></script>
</body>
</html>
